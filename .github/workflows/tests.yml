name: Python tests

on:
  push:
    branches:
      - veronikashpilevaya-eng-todo-app-structure
  pull_request:
    branches:
      - veronikashpilevaya-eng-todo-app-structure

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
